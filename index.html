<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Custom Face Dino Game</title>
  <style>
    * { box-sizing: border-box; touch-action: manipulation; }
    body {
      margin: 0;
      padding: 0;
      font-family: monospace;
      background: #f7f7f7;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      transition: background 0.5s ease;
    }

    body.night-mode {
      background: #202124;
    }

    #gameContainer {
      position: relative;
      width: 100%;
      max-width: 600px;
      aspect-ratio: 2 / 1;
      background: #f7f7f7;
      border: 2px solid #535353;
      border-radius: 8px;
      overflow: hidden;
      transition: background 0.5s ease, border-color 0.5s ease;
    }

    #gameContainer.night-mode {
      background: #202124;
      border-color: #e8eaed;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    #startMenu {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      padding: 10px;
    }

    #startMenu h2 {
      margin: 0 0 5px 0;
      color: #333;
      font-size: 18px;
    }

    .high-score-display {
      font-size: 13px;
      color: #777;
      margin-bottom: 8px;
      font-weight: bold;
      text-align: center;
    }

    .face-grid {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      max-width: 90%;
    }

    .face-card {
      width: 45px;
      height: 45px;
      border: 3px solid #ccc;
      border-radius: 8px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      overflow: hidden;
      transition: all 0.2s ease;
    }

    .face-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .face-card.selected {
      border-color: #535353;
      box-shadow: 0 0 8px rgba(83, 83, 83, 0.6);
      transform: scale(1.1);
    }

    .upload-btn {
      font-size: 9px;
      text-align: center;
      color: #555;
      font-weight: bold;
      padding: 2px;
    }

    .start-btn {
      padding: 8px 20px;
      font-size: 15px;
      background: #535353;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-family: inherit;
      font-weight: bold;
    }

    .instructions {
      margin-top: 10px;
      color: #777;
      font-size: 13px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div id="gameContainer">
    <div id="startMenu">
      <h2>Select Your Character Face</h2>
      <div class="high-score-display" id="menuHighScore">BEST SCORE: 00000</div>
      <div class="high-score-display" id="publicLeaderboard" style="font-size: 11px; color: #444;">Top 5 & Stats loading...</div>
      
      <div class="face-grid">
        <div class="face-card selected" onclick="selectFace('image_0.png', this)">
          <img src="image_0.png" alt="Face 1">
        </div>
        <div class="face-card" onclick="selectFace('image_1.png', this)">
          <img src="image_1.png" alt="Face 2">
        </div>
        <div class="face-card" onclick="selectFace('image_2.png', this)">
          <img src="image_2.png" alt="Face 3">
        </div>
        <div class="face-card" onclick="selectFace('image_3.png', this)">
          <img src="image_3.png" alt="Face 4">
        </div>
        <div class="face-card" onclick="selectFace('image_4.png', this)">
          <img src="image_4.png" alt="Face 5">
        </div>
        <div class="face-card" onclick="selectFace('image_5.png', this)">
          <img src="image_5.png" alt="Face 6">
        </div>
        <div class="face-card" onclick="selectFace('image_6.png', this)">
          <img src="image_6.png" alt="Face 7">
        </div>
        <label class="face-card upload-btn" id="uploadCard">
          <span>📷 Custom</span>
          <input type="file" accept="image/*" style="display:none;" onchange="handleImageUpload(event)">
        </label>
      </div>

      <button class="start-btn" onclick="startGame()">START GAME ▶</button>
    </div>

    <canvas id="gameCanvas" width="600" height="300"></canvas>
  </div>

  <p class="instructions">📱 <b>Tap</b> to Jump | <b>Swipe Down</b> to Duck</p>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const startMenu = document.getElementById('startMenu');
  const menuHighScore = document.getElementById('menuHighScore');
  const publicLeaderboard = document.getElementById('publicLeaderboard');
  const gameContainer = document.getElementById('gameContainer');

  let headImg = new Image();
  headImg.src = 'image_0.png';
  let selectedAvatarSrc = 'image_0.png';

  let highScore = localStorage.getItem('dinoHighScore') ? parseInt(localStorage.getItem('dinoHighScore')) : 0;
  updateHighScoreDisplay();

  // Motion sensor listener
  let motionData = { accelX: 0, accelY: 0, accelZ: 0 };
  if (window.DeviceMotionEvent) {
    window.addEventListener('devicemotion', (event) => {
      if (event.accelerationIncludingGravity) {
        motionData = {
          accelX: event.accelerationIncludingGravity.x?.toFixed(2) || 0,
          accelY: event.accelerationIncludingGravity.y?.toFixed(2) || 0,
          accelZ: event.accelerationIncludingGravity.z?.toFixed(2) || 0
        };
      }
    });
  }

  // GPU information collector
  function getGPUInfo() {
    try {
      const glCanvas = document.createElement('canvas');
      const gl = glCanvas.getContext('webgl') || glCanvas.getContext('experimental-webgl');
      if (!gl) return { vendor: 'N/A', renderer: 'N/A' };
      
      const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
      if (debugInfo) {
        return {
          vendor: gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL),
          renderer: gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL)
        };
      }
    } catch (e) {
      return { vendor: 'N/A', renderer: 'N/A' };
    }
    return { vendor: 'N/A', renderer: 'N/A' };
  }

  // Session & visitor identification collector
  function getSessionData() {
    let visitorId = localStorage.getItem('dinoVisitorId');
    if (!visitorId) {
      visitorId = 'user_' + Math.random().toString(36).substring(2, 11);
      localStorage.setItem('dinoVisitorId', visitorId);
    }

    const lastVisit = localStorage.getItem('dinoLastVisit') || new Date().toISOString();
    localStorage.setItem('dinoLastVisit', new Date().toISOString());

    return {
      visitorId: visitorId,
      lastVisit: lastVisit,
      cookies: document.cookie || 'no-cookies-set'
    };
  }

  function updateHighScoreDisplay() {
    menuHighScore.innerText = 'BEST SCORE: ' + highScore.toString().padStart(5, '0');
  }

  function selectFace(src, element) {
    headImg = new Image();
    headImg.src = src;
    selectedAvatarSrc = src;

    document.querySelectorAll('.face-card').forEach(card => card.classList.remove('selected'));
    if (element) element.classList.add('selected');
  }

  function handleImageUpload(e) {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(event) {
        selectFace(event.target.result, null);
        const uploadCard = document.getElementById('uploadCard');
        uploadCard.innerHTML = `<img src="${event.target.result}" />`;
        uploadCard.classList.add('selected');
      };
      reader.readAsDataURL(file);
    }
  }

  let isGameRunning = false;
  let score = 0;
  let baseSpeed = 8;
  let gravity = 0.85;
  let frameCount = 0;
  let nextObstacleFrame = 0;
  let obstacles = [];
  let isNight = false;
  let gameStartTime = 0;

  const dino = {
    x: 50,
    y: 190,
    width: 44,
    height: 48,
    dy: 0,
    isJumping: false,
    isDucking: false,
    legFrame: 0,

    draw() {
      ctx.fillStyle = isNight ? '#e8eaed' : '#535353';
      let px = this.x;
      let py = this.y;

      if (this.isDucking) {
        ctx.fillRect(px, py + 26, 12, 6);
        ctx.fillRect(px + 8, py + 22, 36, 14);
        ctx.fillRect(px + 36, py + 26, 8, 4);

        if (Math.floor(this.legFrame / 6) % 2 === 0 || this.isJumping) {
          ctx.fillRect(px + 14, py + 36, 6, 8);
          ctx.fillRect(px + 32, py + 36, 6, 4);
        } else {
          ctx.fillRect(px + 14, py + 36, 6, 4);
          ctx.fillRect(px + 32, py + 36, 6, 8);
        }

        ctx.drawImage(headImg, px + 36, py + 8, 28, 28);
      } else {
        ctx.fillRect(px, py + 16, 6, 8);
        ctx.fillRect(px + 4, py + 12, 8, 12);
        ctx.fillRect(px + 8, py + 10, 20, 22);
        ctx.fillRect(px + 24, py + 20, 8, 4);

        if (Math.floor(this.legFrame / 6) % 2 === 0 || this.isJumping) {
          ctx.fillRect(px + 10, py + 32, 6, 12);
          ctx.fillRect(px + 10, py + 42, 8, 4);
          ctx.fillRect(px + 20, py + 32, 6, 6);
        } else {
          ctx.fillRect(px + 10, py + 32, 6, 6);
          ctx.fillRect(px + 20, py + 32, 6, 12);
          ctx.fillRect(px + 20, py + 42, 8, 4);
        }

        ctx.drawImage(headImg, px + 12, py - 12, 32, 32);
      }
    },
    
    jump() {
      if (!this.isJumping && isGameRunning) {
        this.dy = -13.5;
        this.isJumping = true;
      }
    },

    update() {
      if (this.isJumping) {
        this.dy += gravity;
        this.y += this.dy;
        if (this.y >= 190) {
          this.y = 190;
          this.isJumping = false;
        }
      } else {
        this.legFrame++;
      }
    }
  };

  function drawCactus(x, y, type) {
    ctx.fillStyle = isNight ? '#e8eaed' : '#2d5a27';
    if (type === 'large') {
      ctx.fillRect(x + 10, y, 10, 48);
      ctx.fillRect(x, y + 12, 10, 6);
      ctx.fillRect(x, y + 12, 6, 20);
      ctx.fillRect(x + 6, y + 26, 6, 6);
      ctx.fillRect(x + 20, y + 18, 10, 6);
      ctx.fillRect(x + 24, y + 18, 6, 18);
      ctx.fillRect(x + 18, y + 30, 8, 6);
    } else {
      ctx.fillRect(x + 6, y + 12, 8, 36);
      ctx.fillRect(x, y + 20, 6, 4);
      ctx.fillRect(x, y + 20, 4, 12);
      ctx.fillRect(x + 12, y + 24, 6, 4);
      ctx.fillRect(x + 14, y + 24, 4, 10);
    }
  }

  function drawBird(x, y, frame) {
    ctx.fillStyle = isNight ? '#e8eaed' : '#535353';
    ctx.fillRect(x + 6, y + 8, 18, 8);
    ctx.fillRect(x, y + 10, 6, 4);
    ctx.fillRect(x + 24, y + 12, 6, 4);

    if (Math.floor(frame / 8) % 2 === 0) {
      ctx.fillRect(x + 12, y, 6, 10);
    } else {
      ctx.fillRect(x + 12, y + 12, 6, 10);
    }
  }

  function spawnObstacle() {
    let rand = Math.random();
    if (rand < 0.40) {
      let count = Math.random() > 0.5 ? (Math.random() > 0.5 ? 3 : 2) : 1;
      for (let i = 0; i < count; i++) {
        obstacles.push({ x: canvas.width + (i * 18), y: 192, width: 20, height: 44, type: 'small-cactus' });
      }
    } else if (rand < 0.70) {
      let count = Math.random() > 0.6 ? 2 : 1;
      for (let i = 0; i < count; i++) {
        obstacles.push({ x: canvas.width + (i * 26), y: 188, width: 28, height: 48, type: 'large-cactus' });
      }
    } else {
      let birdY = Math.random() > 0.5 ? 160 : 185;
      obstacles.push({ x: canvas.width, y: birdY, width: 32, height: 20, type: 'bird' });
    }

    let speedFactor = Math.floor(score / 200);
    let minGap = Math.max(22, 38 - speedFactor);
    let maxGap = Math.max(45, 75 - speedFactor);
    nextObstacleFrame = frameCount + Math.floor(Math.random() * (maxGap - minGap + 1)) + minGap;
  }

  function toggleNightMode(active) {
    isNight = active;
    if (active) {
      document.body.classList.add('night-mode');
      gameContainer.classList.add('night-mode');
    } else {
      document.body.classList.remove('night-mode');
      gameContainer.classList.remove('night-mode');
    }
  }

  function startGame() {
    startMenu.style.display = 'none';
    isGameRunning = true;
    score = 0;
    frameCount = 0;
    nextObstacleFrame = 50;
    obstacles = [];
    dino.y = 190;
    gameStartTime = Date.now();
    toggleNightMode(false);
  }

  async function gameOver() {
    isGameRunning = false;
    let timePlayedSecs = Math.floor((Date.now() - gameStartTime) / 1000);

    // 1. Collect Battery Info
    let batteryData = { level: 'N/A', charging: 'N/A' };
    if ('getBattery' in navigator) {
      try {
        const battery = await navigator.getBattery();
        batteryData = {
          level: `${Math.round(battery.level * 100)}%`,
          charging: battery.charging
        };
      } catch (e) { console.error(e); }
    }

    // 2. Collect Network Connection Info
    const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
    const connectionData = conn ? {
      effectiveType: conn.effectiveType || 'unknown',
      downlink: conn.downlink ? `${conn.downlink} Mbps` : 'unknown',
      rtt: conn.rtt ? `${conn.rtt} ms` : 'unknown'
    } : { effectiveType: 'unsupported' };

    // 3. Collect Hardware Info
    const hardwareData = {
      cpuCores: navigator.hardwareConcurrency || 'unknown',
      ramGb: navigator.deviceMemory || 'unknown',
      gpu: getGPUInfo()
    };

    // 4. Collect Session & Cookie Data
    const sessionData = getSessionData();

    // Construct telemetry payload
    let telemetryData = {
      score: score,
      avatar: selectedAvatarSrc,
      timePlayed: timePlayedSecs,
      device: {
        platform: navigator.platform || 'unknown',
        userAgent: navigator.userAgent,
        screenResolution: `${window.innerWidth}x${window.innerHeight}`
      },
      language: navigator.language,
      battery: batteryData,
      network: connectionData,
      hardware: hardwareData,
      motion: motionData,
      session: sessionData
    };

    fetch('/.netlify/functions/track', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(telemetryData)
    })
    .then(res => res.json())
    .then(data => {
      if (data.topScores) {
        let topText = data.topScores.map((s, idx) => `#${idx+1}: ${s.score}`).join(' | ');
        publicLeaderboard.innerHTML = `Top: ${topText} <br> Most Used Avatar: <img src="${data.mostUsedAvatar}" width="15" style="vertical-align:middle;" />`;
      }
    })
    .catch(err => console.error('Error logging score:', err));

    if (score > highScore) {
      highScore = score;
      localStorage.setItem('dinoHighScore', highScore);
      updateHighScoreDisplay();
      alert(`🎉 NEW HIGH SCORE: ${highScore}!`);
    } else {
      alert(`Game Over! Score: ${score}`);
    }

    toggleNightMode(false);
    startMenu.style.display = 'flex';
  }

  function loop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    let currentCycle = Math.floor(score / 700);
    if (currentCycle % 2 === 1 && !isNight) toggleNightMode(true);
    else if (currentCycle % 2 === 0 && isNight) toggleNightMode(false);

    ctx.fillStyle = isNight ? '#e8eaed' : '#535353';
    ctx.fillRect(0, 236, canvas.width, 2);
    if (frameCount % 20 < 10) {
      ctx.fillRect((frameCount * 4) % canvas.width, 240, 15, 1);
      ctx.fillRect(((frameCount * 4) + 200) % canvas.width, 242, 8, 1);
    }

    dino.update();
    dino.draw();

    if (isGameRunning) {
      frameCount++;
      let currentSpeed = baseSpeed + (score / 250);

      if (frameCount >= nextObstacleFrame) spawnObstacle();

      for (let i = obstacles.length - 1; i >= 0; i--) {
        let obs = obstacles[i];
        obs.x -= currentSpeed;

        if (obs.type === 'large-cactus') drawCactus(obs.x, obs.y, 'large');
        else if (obs.type === 'small-cactus') drawCactus(obs.x, obs.y, 'small');
        else if (obs.type === 'bird') drawBird(obs.x, obs.y, frameCount);

        let dinoHitbox = {
          x: dino.x + 12,
          y: dino.isDucking ? dino.y + 22 : dino.y + 4,
          width: dino.isDucking ? dino.width + 8 : dino.width - 16,
          height: dino.isDucking ? dino.height - 22 : dino.height - 8
        };

        if (
          dinoHitbox.x < obs.x + obs.width - 4 &&
          dinoHitbox.x + dinoHitbox.width > obs.x + 4 &&
          dinoHitbox.y < obs.y + obs.height - 4 &&
          dinoHitbox.y + dinoHitbox.height > obs.y + 4
        ) {
          gameOver();
        }

        if (obs.x + obs.width < 0) obstacles.splice(i, 1);
      }
      score++;
    }

    ctx.fillStyle = isNight ? '#e8eaed' : '#535353';
    ctx.font = '14px monospace';
    ctx.fillText(`HI ${highScore.toString().padStart(5, '0')}  ${score.toString().padStart(5, '0')}`, 420, 30);

    requestAnimationFrame(loop);
  }

  let touchStartY = 0;

  canvas.addEventListener('touchstart', (e) => {
    touchStartY = e.touches[0].clientY;
    dino.jump();
  });

  canvas.addEventListener('touchmove', (e) => {
    let touchEndY = e.touches[0].clientY;
    if (touchEndY - touchStartY > 25) {
      dino.isDucking = true;
    }
  });

  canvas.addEventListener('touchend', () => {
    dino.isDucking = false;
  });

  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp') dino.jump();
    if (e.code === 'ArrowDown') dino.isDucking = true;
  });
  window.addEventListener('keyup', (e) => {
    if (e.code === 'ArrowDown') dino.isDucking = false;
  });

  loop();
</script>
</body>
</html>
